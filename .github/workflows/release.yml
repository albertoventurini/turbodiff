name: Release

# Pushing a `v*` tag builds the app and uploads it to a draft GitHub Release
# (TECH.md §11). A pull request that changes the packaging builds it too,
# without releasing, and keeps the bundles as workflow artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the AppImage and .deb run on
          # distributions with an older glibc.
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
            bundles: target/release/bundle
          # Unsigned (ad-hoc signed) until there's an Apple Developer account.
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            bundles: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version ${version} in package.json"
            exit 1
          fi

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Without a tag (a pull request), the action only builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: TurboDiff v__VERSION__
          releaseBody: See the README for how to install each build.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep the bundles
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: turbodiff-${{ matrix.name }}
          path: |
            ${{ matrix.bundles }}/deb/*.deb
            ${{ matrix.bundles }}/appimage/*.AppImage
            ${{ matrix.bundles }}/dmg/*.dmg
          if-no-files-found: error
