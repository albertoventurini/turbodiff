name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux only: macOS runners are scarce, and the macOS-only code uses cfg!(),
  # so clippy checks it on Linux too. The test job still builds on macOS.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: pnpm lint
      - name: cargo fmt
        run: cargo fmt --all --check
      # clippy only warns, even with -D warnings, when a clippy.toml path no
      # longer resolves (for example after a gix upgrade), so check for that too.
      - name: cargo clippy
        # Without an explicit shell, GitHub doesn't set pipefail, so the step
        # would take tee's exit status instead of clippy's.
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
          if grep -q "does not refer to a reachable function" clippy.log; then
            echo "::error::clippy.toml names a path that no longer resolves"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm test
      - name: cargo test
        run: cargo test --locked --workspace
