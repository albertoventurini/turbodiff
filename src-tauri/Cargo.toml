[package]
name = "turbodiff"
version = "0.1.0"
description = "A read-only desktop viewer for git diffs"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde.workspace = true
specta.workspace = true
# tauri-specta's Tauri 2 support has only been released as release candidates.
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
turbodiff-repo = { path = "../crates/turbodiff-repo" }
serde_json = "1.0.154"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-store = "2.5.0"
tauri-plugin-window-state = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
